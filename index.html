<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LSQ → Français</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;background:#0b0b0d;color:#fff;
    font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  }
  .app{max-width:760px;margin:auto;padding:14px}
  h1{font-size:28px;margin:6px 0 14px}
  .camera-wrap{position:relative}
  video{
    width:100%;height:52vh;min-height:360px;object-fit:cover;
    border-radius:20px;background:#17171a;
    border:1px solid #2a2a30;
  }
  video.front{transform:scaleX(-1)}
  video.back{transform:none}
  .camera-label{
    position:absolute;top:12px;left:12px;
    background:#0009;backdrop-filter:blur(10px);
    padding:8px 11px;border-radius:999px;font-size:12px
  }
  .buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  button{
    border:0;border-radius:14px;padding:15px;
    font-size:15px;font-weight:700
  }
  #cameraBtn,#switchBtn,#speakBtn{background:#2a2a30;color:#fff}
  #startBtn{background:#fff;color:#111}
  #startBtn.on{background:#ff6b6b}
  button:disabled{opacity:.45}
  .panel{
    margin-top:12px;background:#151518;border:1px solid #2a2a30;
    border-radius:18px;padding:18px
  }
  .label{font-size:11px;color:#94949d;font-weight:800;letter-spacing:.12em}
  #translation{font-size:28px;font-weight:700;line-height:1.15;margin-top:10px}
  #glosses{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  #glosses span{
    background:#27272c;padding:6px 8px;border-radius:8px;
    font-size:11px;font-weight:700
  }
  #confidence{float:right}
  #debug{
    white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
    font-size:12px;line-height:1.5;color:#d0d0d6;
    max-height:240px;overflow:auto
  }
  .hint{font-size:12px;color:#777780;line-height:1.5;margin-top:12px}
</style>
</head>
<body>
<div class="app">
  <h1>LSQ → Français</h1>

  <div class="camera-wrap">
    <video id="video" class="front" autoplay muted playsinline></video>
    <div id="cameraLabel" class="camera-label">Caméra avant</div>
  </div>

  <div class="buttons">
    <button id="cameraBtn">Activer caméra</button>
    <button id="switchBtn" disabled>🔄 Changer caméra</button>
    <button id="startBtn" disabled>Commencer</button>
    <button id="speakBtn" disabled>🔊 Écouter</button>
  </div>

  <div class="panel">
    <div class="label">
      TRADUCTION
      <span id="confidence">—</span>
    </div>
    <div id="translation">Signe devant la caméra.</div>
    <div id="glosses"></div>
  </div>

  <div class="panel">
    <div class="label">DEBUG</div>
    <div id="debug">Page chargée ✅</div>
  </div>

  <div class="hint">
    La voix se déclenche automatiquement quand la confiance est d'au moins 75 %.
    Le bouton Écouter permet de répéter la dernière traduction.
  </div>

  <canvas id="canvas" hidden></canvas>
</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const cameraBtn = document.getElementById("cameraBtn");
const switchBtn = document.getElementById("switchBtn");
const startBtn = document.getElementById("startBtn");
const speakBtn = document.getElementById("speakBtn");
const cameraLabel = document.getElementById("cameraLabel");
const translationEl = document.getElementById("translation");
const glossesEl = document.getElementById("glosses");
const confidenceEl = document.getElementById("confidence");
const debugEl = document.getElementById("debug");

let stream = null;
let currentFacing = "user";
let running = false;
let busy = false;
let lastTranslation = "";
let lastSpokenTranslation = "";

function log(msg) {
  debugEl.textContent += "\n" + msg;
  debugEl.scrollTop = debugEl.scrollHeight;
}

function speak(text) {
  if (!text || !("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const u = new SpeechSynthesisUtterance(text);
  u.lang = "fr-CA";
  u.rate = 1;
  u.pitch = 1;

  speechSynthesis.speak(u);
}

async function startCamera(facing = currentFacing) {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
  }

  currentFacing = facing;

  const constraints = {
    audio: false,
    video: {
      facingMode: { ideal: currentFacing },
      width: { ideal: 1280 },
      height: { ideal: 720 }
    }
  };

  stream = await navigator.mediaDevices.getUserMedia(constraints);
  video.srcObject = stream;
  await video.play();

  const isFront = currentFacing === "user";
  video.classList.toggle("front", isFront);
  video.classList.toggle("back", !isFront);

  cameraLabel.textContent = isFront ? "Caméra avant" : "Caméra arrière";

  log("✅ Caméra active : " + (isFront ? "avant" : "arrière"));
}

cameraBtn.onclick = async () => {
  try {
    debugEl.textContent = "Activation caméra...";
    await startCamera("user");

    cameraBtn.disabled = true;
    cameraBtn.textContent = "Caméra active ✅";
    switchBtn.disabled = false;
    startBtn.disabled = false;
  } catch (e) {
    log("❌ ERREUR CAMÉRA: " + e.message);
    alert("Impossible d'ouvrir la caméra.");
  }
};

switchBtn.onclick = async () => {
  try {
    const next = currentFacing === "user" ? "environment" : "user";
    log("🔄 Changement de caméra...");
    await startCamera(next);
  } catch (e) {
    log("❌ Impossible de changer de caméra: " + e.message);
  }
};

startBtn.onclick = () => {
  running = !running;
  startBtn.textContent = running ? "Arrêter" : "Commencer";
  startBtn.classList.toggle("on", running);

  if (running) {
    log("▶️ Traduction démarrée");
    loop();
  } else {
    log("⏹ Traduction arrêtée");
  }
};

speakBtn.onclick = () => {
  speak(lastTranslation);
};

function captureFrame() {
  if (!video.videoWidth || !video.videoHeight) {
    throw new Error("La vidéo n'est pas encore prête.");
  }

  const width = 512;
  const ratio = video.videoHeight / video.videoWidth;

  canvas.width = width;
  canvas.height = Math.round(width * ratio);

  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  const data = canvas.toDataURL("image/jpeg", 0.72);

  if (!data || data.length < 1000) {
    throw new Error("Image capturée vide.");
  }

  return data;
}

async function captureSequence() {
  const frames = [];

  log("📸 Capture de 10 images...");

  for (let i = 0; i < 10; i++) {
    frames.push(captureFrame());
    await new Promise(r => setTimeout(r, 220));
  }

  log("✅ 10 images capturées");
  return frames;
}

async function loop() {
  if (!running || busy) return;
  busy = true;

  try {
    const frames = await captureSequence();

    if (!running) return;

    log("⬆️ Envoi à Astra...");

    const response = await fetch("/api/translate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ frames })
    });

    log("HTTP " + response.status);

    const raw = await response.text();

    let data;
    try {
      data = JSON.parse(raw);
    } catch {
      throw new Error("Réponse API invalide: " + raw.slice(0, 160));
    }

    if (!response.ok) {
      throw new Error(data.error || "Erreur API");
    }

    const confidence = Number(data.confidence || 0);
    confidenceEl.textContent = Math.round(confidence * 100) + "%";

    if (data.detected && data.french) {
      lastTranslation = data.french;
      translationEl.textContent = data.french;
      speakBtn.disabled = false;

      glossesEl.innerHTML = "";
      (data.glosses || []).forEach(g => {
        const chip = document.createElement("span");
        chip.textContent = g;
        glossesEl.appendChild(chip);
      });

      log("✅ Reconnu : " + data.french);
      log("Confiance : " + Math.round(confidence * 100) + "%");

      if (
        confidence >= 0.75 &&
        data.french !== lastSpokenTranslation
      ) {
        speak(data.french);
        lastSpokenTranslation = data.french;
        log("🔊 Traduction prononcée");
      }
    } else {
      translationEl.textContent = "Aucun signe reconnu.";
      glossesEl.innerHTML = "";
      log("⚠️ Aucun signe reconnu");
    }

  } catch (e) {
    translationEl.textContent = "Erreur";
    log("❌ " + e.message);
  } finally {
    busy = false;

    if (running) {
      setTimeout(loop, 350);
    }
  }
}
</script>
</body>
</html>
