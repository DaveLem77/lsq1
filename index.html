<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LSQ → Français</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#09090b;
  color:white;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif
}
.app{max-width:760px;margin:auto;padding:12px}
h1{margin:5px 0 14px;font-size:28px}
.cam{position:relative}
video{
  width:100%;
  height:55vh;
  min-height:390px;
  object-fit:cover;
  border-radius:22px;
  background:#17171a;
  border:1px solid #29292f
}
video.front{transform:scaleX(-1)}
.badge{
  position:absolute;
  top:12px;
  left:12px;
  padding:8px 11px;
  border-radius:999px;
  background:#000a;
  backdrop-filter:blur(10px);
  font-size:12px
}
.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:9px
}
button{
  border:0;
  border-radius:14px;
  padding:14px;
  font-size:14px;
  font-weight:750
}
.dark{background:#29292e;color:white}
.white{background:white;color:#111}
.stop{background:#ff6b6b!important}
button:disabled{opacity:.4}

.result{
  margin-top:10px;
  background:#141417;
  border:1px solid #29292f;
  border-radius:19px;
  padding:19px
}
.title{
  color:#91919a;
  font-size:11px;
  letter-spacing:.12em;
  font-weight:800
}
#confidence{float:right}
#translation{
  margin-top:11px;
  font-size:29px;
  font-weight:700;
  line-height:1.15;
  min-height:65px
}
#glosses{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:8px
}
#glosses span{
  background:#29292f;
  padding:6px 8px;
  border-radius:8px;
  font-size:11px;
  font-weight:700
}
#vision{
  margin-top:10px;
  color:#85858f;
  font-size:12px;
  line-height:1.45
}
#debug{
  margin-top:10px;
  font-size:11px;
  color:#71717a
}
</style>
</head>

<body>
<div class="app">

<h1>LSQ → Français</h1>

<div class="cam">
  <video id="video" class="front" autoplay muted playsinline></video>
  <div id="status" class="badge">Caméra inactive</div>
</div>

<div class="buttons">
  <button id="cameraBtn" class="dark">Activer caméra</button>
  <button id="switchBtn" class="dark" disabled>🔄 Changer caméra</button>
  <button id="startBtn" class="white" disabled>Commencer</button>
  <button id="speakBtn" class="dark" disabled>🔊 Écouter</button>
</div>

<div class="result">
  <div class="title">
    MEILLEURE INTERPRÉTATION
    <span id="confidence">—</span>
  </div>

  <div id="translation">Signe devant la caméra.</div>
  <div id="glosses"></div>
  <div id="vision"></div>
</div>

<div id="debug">Prêt.</div>

<canvas id="canvas" hidden></canvas>

</div>

<script>
const video=document.querySelector("#video");
const canvas=document.querySelector("#canvas");
const cameraBtn=document.querySelector("#cameraBtn");
const switchBtn=document.querySelector("#switchBtn");
const startBtn=document.querySelector("#startBtn");
const speakBtn=document.querySelector("#speakBtn");
const statusEl=document.querySelector("#status");
const translationEl=document.querySelector("#translation");
const glossesEl=document.querySelector("#glosses");
const confidenceEl=document.querySelector("#confidence");
const visionEl=document.querySelector("#vision");
const debugEl=document.querySelector("#debug");

let stream=null;
let facing="user";
let running=false;
let busy=false;
let lastText="";
let lastSpoken="";

function status(t){
  statusEl.textContent=t;
}

function speak(text){
  if(!text || !("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const u=new SpeechSynthesisUtterance(text);
  u.lang="fr-CA";
  u.rate=1;

  speechSynthesis.speak(u);
}

async function openCamera(newFacing){
  if(stream){
    stream.getTracks().forEach(t=>t.stop());
  }

  facing=newFacing;

  stream=await navigator.mediaDevices.getUserMedia({
    audio:false,
    video:{
      facingMode:{ideal:facing},
      width:{ideal:1280},
      height:{ideal:720},
      frameRate:{ideal:30}
    }
  });

  video.srcObject=stream;
  await video.play();

  video.classList.toggle("front",facing==="user");

  status(facing==="user"?"Caméra avant":"Caméra arrière");
}

cameraBtn.onclick=async()=>{
  try{
    await openCamera("user");
    cameraBtn.disabled=true;
    cameraBtn.textContent="Caméra active ✅";
    switchBtn.disabled=false;
    startBtn.disabled=false;
  }catch(e){
    alert("Impossible d'ouvrir la caméra.");
    debugEl.textContent=e.message;
  }
};

switchBtn.onclick=async()=>{
  try{
    status("Changement...");
    await openCamera(facing==="user"?"environment":"user");
  }catch(e){
    debugEl.textContent="Erreur caméra: "+e.message;
  }
};

startBtn.onclick=()=>{
  running=!running;

  startBtn.textContent=running?"Arrêter":"Commencer";
  startBtn.classList.toggle("stop",running);

  if(running){
    status("En écoute...");
    analyse();
  }else{
    status("En pause");
  }
};

speakBtn.onclick=()=>speak(lastText);

function frame(){
  if(!video.videoWidth) throw new Error("Caméra pas prête");

  const w=640;
  const ratio=video.videoHeight/video.videoWidth;

  canvas.width=w;
  canvas.height=Math.round(w*ratio);

  canvas.getContext("2d").drawImage(
    video,
    0,0,
    canvas.width,
    canvas.height
  );

  return canvas.toDataURL("image/jpeg",0.78);
}

async function capture(){
  const frames=[];

  // 16 images sur environ 2.25 secondes :
  // beaucoup plus d'information de mouvement que l'ancienne version.
  for(let i=0;i<16;i++){
    frames.push(frame());
    await new Promise(r=>setTimeout(r,150));
  }

  return frames;
}

async function analyse(){
  if(!running || busy) return;

  busy=true;

  try{
    status("Capture du mouvement...");
    const frames=await capture();

    if(!running) return;

    status("Astra analyse...");
    debugEl.textContent="16 images envoyées à Astra...";

    const r=await fetch("/api/translate",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({frames})
    });

    const data=await r.json();

    if(!r.ok){
      throw new Error(data.error || "Erreur API");
    }

    const confidence=Number(data.confidence||0);
    confidenceEl.textContent=Math.round(confidence*100)+"%";

    if(data.has_gesture && data.french){
      lastText=data.french;

      translationEl.textContent=data.french;
      visionEl.textContent=data.visual_description || "";

      glossesEl.innerHTML="";
      (data.glosses||[]).forEach(g=>{
        const el=document.createElement("span");
        el.textContent=g;
        glossesEl.appendChild(el);
      });

      speakBtn.disabled=false;

      // IMPORTANT:
      // aucun seuil de confiance ici.
      // Même 30 % ou 40 % est affiché.
      if(data.french!==lastSpoken){
        speak(data.french);
        lastSpoken=data.french;
      }

      status("Interprétation trouvée");
      debugEl.textContent=
        "Astra a donné sa meilleure estimation ("+
        Math.round(confidence*100)+" %).";
    }else{
      translationEl.textContent="Je ne vois pas encore de geste clair.";
      visionEl.textContent=data.visual_description || "";
      glossesEl.innerHTML="";
      status("Fais un signe");
      debugEl.textContent="Astra ne voit pas de geste communicatif.";
    }

  }catch(e){
    status("Erreur");
    debugEl.textContent="Erreur: "+e.message;
  }finally{
    busy=false;

    if(running){
      setTimeout(analyse,250);
    }
  }
}
</script>

</body>
</html>
