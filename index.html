<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LSQ → Français</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09090b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.app{max-width:760px;margin:auto;padding:12px}h1{margin:6px 0 14px;font-size:28px}
.camera{position:relative;overflow:hidden;border-radius:22px;background:#151518;border:1px solid #29292f}
video{display:block;width:100%;height:65vh;min-height:420px;object-fit:cover;transform:scaleX(-1)}
.status{position:absolute;top:12px;left:12px;background:#0009;backdrop-filter:blur(10px);padding:8px 11px;border-radius:999px;font-size:12px}
.buttons{display:flex;gap:10px;margin-top:10px}button{flex:1;padding:15px;border:0;border-radius:14px;font-size:15px;font-weight:700}
#cameraBtn{background:#28282d;color:#fff}#startBtn{background:#fff;color:#111}#startBtn.on{background:#ff6b6b}
.result{margin-top:10px;padding:20px;border-radius:18px;background:#141417;border:1px solid #29292f}
.top{font-size:11px;color:#8d8d96;font-weight:800;letter-spacing:.12em}.top span{float:right}
#translation{font-size:29px;font-weight:650;line-height:1.15;min-height:72px;margin-top:12px}
#glosses{display:flex;gap:6px;flex-wrap:wrap}#glosses span{font-size:11px;background:#27272c;padding:6px 8px;border-radius:8px}
.hint{font-size:12px;color:#73737c;line-height:1.5;margin:12px 4px}
</style>
</head>
<body>
<div class="app">
  <h1>LSQ → Français</h1>

  <div class="camera">
    <video id="video" autoplay muted playsinline></video>
    <div id="status" class="status">Caméra inactive</div>
  </div>

  <div class="buttons">
    <button id="cameraBtn">Activer caméra</button>
    <button id="startBtn" disabled>Commencer</button>
  </div>

  <div class="result">
    <div class="top">TRADUCTION <span id="confidence">—</span></div>
    <div id="translation">Signe devant la caméra.</div>
    <div id="glosses"></div>
  </div>

  <div class="hint">Garde tes deux mains, ton visage et le haut du corps visibles.</div>
  <canvas id="canvas" hidden></canvas>
</div>

<script>
const video=document.querySelector("#video");
const canvas=document.querySelector("#canvas");
const cameraBtn=document.querySelector("#cameraBtn");
const startBtn=document.querySelector("#startBtn");
const statusEl=document.querySelector("#status");
const translationEl=document.querySelector("#translation");
const glossesEl=document.querySelector("#glosses");
const confidenceEl=document.querySelector("#confidence");

let running=false,busy=false;

cameraBtn.onclick=async()=>{
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:"user",width:{ideal:1280},height:{ideal:720}},
      audio:false
    });
    video.srcObject=stream;
    await video.play();
    statusEl.textContent="Caméra prête";
    cameraBtn.disabled=true;
    startBtn.disabled=false;
  }catch{
    alert("Autorise la caméra dans ton navigateur.");
  }
};

startBtn.onclick=()=>{
  running=!running;
  startBtn.textContent=running?"Arrêter":"Commencer";
  startBtn.classList.toggle("on",running);
  statusEl.textContent=running?"En écoute":"En pause";
  if(running) loop();
};

function captureFrame(){
  const w=512;
  const ratio=video.videoHeight/video.videoWidth||0.75;
  canvas.width=w; canvas.height=Math.round(w*ratio);
  canvas.getContext("2d").drawImage(video,0,0,canvas.width,canvas.height);
  return canvas.toDataURL("image/jpeg",0.72);
}

async function captureSequence(){
  const frames=[];
  for(let i=0;i<10;i++){
    frames.push(captureFrame());
    await new Promise(r=>setTimeout(r,220));
  }
  return frames;
}

async function loop(){
  if(!running||busy)return;
  busy=true;

  try{
    statusEl.textContent="Capture...";
    const frames=await captureSequence();
    if(!running)return;

    statusEl.textContent="Astra analyse...";

    const response=await fetch("/api/translate",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({frames})
    });

    const data=await response.json();
    if(!response.ok)throw new Error(data.error||"Erreur");

    confidenceEl.textContent=Math.round((data.confidence||0)*100)+"%";

    if(data.detected&&data.french){
      translationEl.textContent=data.french;
      glossesEl.innerHTML="";
      (data.glosses||[]).forEach(g=>{
        const s=document.createElement("span");
        s.textContent=g;
        glossesEl.appendChild(s);
      });
      statusEl.textContent="Reconnu";

      if((data.confidence||0)>=0.75){
        speechSynthesis.cancel();
        const u=new SpeechSynthesisUtterance(data.french);
        u.lang="fr-CA";
        speechSynthesis.speak(u);
      }
    }else{
      statusEl.textContent="Continue de signer";
    }
  }catch(e){
    statusEl.textContent="Erreur";
    translationEl.textContent=e.message;
  }finally{
    busy=false;
    if(running)setTimeout(loop,300);
  }
}
</script>
</body>
</html>
