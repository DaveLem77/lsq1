<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LSQ Debug</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;background:#0b0b0d;color:#fff;
    font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  }
  .app{max-width:760px;margin:auto;padding:14px}
  h1{font-size:28px;margin:6px 0 14px}
  video{
    width:100%;height:52vh;min-height:360px;object-fit:cover;
    border-radius:20px;background:#17171a;transform:scaleX(-1);
    border:1px solid #2a2a30;
  }
  .buttons{display:flex;gap:10px;margin-top:10px}
  button{
    flex:1;border:0;border-radius:14px;padding:15px;
    font-size:15px;font-weight:700
  }
  #cameraBtn{background:#2a2a30;color:#fff}
  #startBtn{background:#fff;color:#111}
  #startBtn.on{background:#ff6b6b}
  .panel{
    margin-top:12px;background:#151518;border:1px solid #2a2a30;
    border-radius:18px;padding:18px
  }
  .label{font-size:11px;color:#94949d;font-weight:800;letter-spacing:.12em}
  #translation{font-size:28px;font-weight:700;line-height:1.15;margin-top:10px}
  #debug{
    white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
    font-size:13px;line-height:1.55;color:#d0d0d6
  }
  .ok{color:#7ee2a8}.err{color:#ff8585}.muted{color:#888}
</style>
</head>
<body>
<div class="app">
  <h1>LSQ → Français <span style="font-size:14px;color:#888">DEBUG</span></h1>

  <video id="video" autoplay muted playsinline></video>

  <div class="buttons">
    <button id="cameraBtn">1. Activer caméra</button>
    <button id="startBtn" disabled>2. Commencer</button>
  </div>

  <div class="panel">
    <div class="label">TRADUCTION</div>
    <div id="translation">Rien pour l'instant.</div>
  </div>

  <div class="panel">
    <div class="label">DEBUG — REGARDE ICI</div>
    <div id="debug">Page chargée ✅</div>
  </div>

  <canvas id="canvas" hidden></canvas>
</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const cameraBtn = document.getElementById("cameraBtn");
const startBtn = document.getElementById("startBtn");
const translationEl = document.getElementById("translation");
const debugEl = document.getElementById("debug");

let running = false;
let busy = false;
let stream = null;

function log(msg) {
  debugEl.textContent += "\n" + msg;
  debugEl.scrollTop = debugEl.scrollHeight;
}

function resetDebug() {
  debugEl.textContent = "Début du test...";
}

cameraBtn.onclick = async () => {
  resetDebug();
  log("1. Demande d'accès à la caméra...");

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user",
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    video.srcObject = stream;
    await video.play();

    log("✅ Caméra OK");
    log("Résolution vidéo: " + video.videoWidth + "x" + video.videoHeight);

    cameraBtn.disabled = true;
    startBtn.disabled = false;
    cameraBtn.textContent = "Caméra active ✅";
  } catch (e) {
    log("❌ ERREUR CAMÉRA: " + e.message);
    alert("La caméra n'a pas pu être ouverte.");
  }
};

startBtn.onclick = () => {
  running = !running;
  startBtn.textContent = running ? "Arrêter" : "2. Commencer";
  startBtn.classList.toggle("on", running);

  if (running) {
    resetDebug();
    log("✅ Bouton Commencer fonctionne");
    log("Démarrage du test...");
    loop();
  } else {
    log("⏹ Test arrêté");
  }
};

function captureFrame() {
  if (!video.videoWidth || !video.videoHeight) {
    throw new Error("La vidéo n'est pas encore prête.");
  }

  const width = 512;
  const ratio = video.videoHeight / video.videoWidth;

  canvas.width = width;
  canvas.height = Math.round(width * ratio);

  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  const data = canvas.toDataURL("image/jpeg", 0.72);

  if (!data || data.length < 1000) {
    throw new Error("L'image capturée semble vide.");
  }

  return data;
}

async function captureSequence() {
  const frames = [];

  log("2. Capture de 10 images...");

  for (let i = 0; i < 10; i++) {
    frames.push(captureFrame());
    log("   image " + (i + 1) + "/10 ✅");
    await new Promise(r => setTimeout(r, 220));
  }

  log("✅ 10 images capturées");
  return frames;
}

async function loop() {
  if (!running || busy) return;
  busy = true;

  try {
    const frames = await captureSequence();

    if (!running) return;

    log("3. Envoi à /api/translate ...");

    const response = await fetch("/api/translate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ frames })
    });

    log("4. Réponse HTTP reçue: " + response.status);

    const raw = await response.text();
    log("5. Réponse brute:");
    log(raw);

    let data;
    try {
      data = JSON.parse(raw);
      log("✅ JSON lisible");
    } catch (e) {
      throw new Error("La réponse n'est pas du JSON valide.");
    }

    if (!response.ok) {
      throw new Error(data.error || "Erreur API inconnue");
    }

    if (data.detected && data.french) {
      translationEl.textContent = data.french;
      log("✅ Signe détecté");
      log("Traduction: " + data.french);
      log("Confiance: " + Math.round((data.confidence || 0) * 100) + "%");
    } else {
      translationEl.textContent = "Aucun signe reconnu.";
      log("⚠️ Astra a répondu, mais n'a rien reconnu.");
      log("Confiance: " + Math.round((data.confidence || 0) * 100) + "%");
    }

  } catch (e) {
    translationEl.textContent = "Erreur";
    log("❌ ERREUR: " + e.message);
    running = false;
    startBtn.textContent = "2. Commencer";
    startBtn.classList.remove("on");
  } finally {
    busy = false;
  }
}
</script>
</body>
</html>
